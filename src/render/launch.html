<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCL 启动器 - Minecraft Java 版启动器</title>
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="css/launch.css">
    <link rel="stylesheet" href="css/components/modal.css">
    
    <style>
        /* 基础变量 */
        :root {
            --primary-color: #4a90e2;
            --success-color: #00c853;
            --warning-color: #ff9800;
            --danger-color: #ff3d00;
            --bg-color: #1a1a2e;
            --card-bg: #2d2d44;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="blue"] {
            --primary-color: #1e88e5;
            --bg-color: #0d47a1;
            --card-bg: #1565c0;
            --text-color: #e3f2fd;
            --text-secondary: #bbdefb;
            --border-color: rgba(255, 255, 255, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #16213e 100%);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        
        a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        button {
            font-family: inherit;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #7b68ee);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary-color);
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }
        
        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            transition: all 0.3s;
        }
        
        .btn-icon:hover {
            background: rgba(74, 144, 226, 0.2);
            border-color: var(--primary-color);
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #7b68ee;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 应用容器 -->
    <div class="launch-app">
        <!-- 头部 -->
        <header class="main-header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">🎮</div>
                    <div class="logo-text">
                        <h1>HCL 启动器</h1>
                        <p>Minecraft Java Edition</p>
                    </div>
                </div>
            </div>
            
            <div class="header-right">
                <!-- 设置按钮 -->
                <button class="btn-icon" onclick="openSettings()" title="设置" id="settings-btn">
                    ⚙️
                </button>
                
                <!-- 用户头像 -->
                <div class="user-avatar" id="user-avatar" onclick="showUserMenu()">
                    <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234a90e2%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22>👤</text></svg>" alt="用户" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234a90e2%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22>👤</text></svg>'">
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <!-- 账户选择 -->
                <div class="account-card">
                    <div class="account-header">
                        <h3>👤 选择账户</h3>
                        <button class="btn-icon btn-small" onclick="addAccount()" title="添加账户">
                            ➕
                        </button>
                    </div>
                    
                    <div class="account-list" id="account-list">
                        <!-- 账户列表会动态加载 -->
                        <div class="account-item active">
                            <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234a90e2%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22>👤</text></svg>" alt="玩家" class="account-avatar">
                            <div class="account-info">
                                <div class="account-name">Player123</div>
                                <div class="account-type">Microsoft 账户</div>
                            </div>
                        </div>
                        
                        <div class="account-item">
                            <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234a90e2%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22>👤</text></svg>" alt="玩家" class="account-avatar">
                            <div class="account-info">
                                <div class="account-name">离线玩家</div>
                                <div class="account-type">离线账户</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 版本选择 -->
                <div class="version-card">
                    <div class="version-header">
                        <h3>📦 游戏版本</h3>
                        <button class="btn-icon btn-small" onclick="refreshVersions()" title="刷新版本列表">
                            🔄
                        </button>
                    </div>
                    
                    <div class="version-controls">
                        <div class="version-filter">
                            <button class="filter-btn active" onclick="filterVersions('all', event)">全部</button>
                            <button class="filter-btn" onclick="filterVersions('release', event)">正式版</button>
                            <button class="filter-btn" onclick="filterVersions('snapshot', event)">快照</button>
                            <button class="filter-btn" onclick="filterVersions('installed', event)">已安装</button>
                        </div>
                        
                        <div class="version-search">
                            <input type="text" placeholder="搜索版本..." class="search-input" id="version-search">
                        </div>
                    </div>
                    
                    <div class="version-list" id="version-list">
                        <div class="version-empty">正在加载版本列表...</div>
                    </div>
                </div>
                
                <!-- 路径信息（由 launch.js 填充） -->
                <div id="path-info" class="path-info-container"></div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="right-panel">
                <div class="launch-panel">
                    <h3>🚀 启动游戏</h3>
                    
                    <div class="launch-status" id="launch-status">
                        <span class="status-icon">🟢</span>
                        <span class="status-text">就绪</span>
                    </div>
                    
                    <div class="launch-buttons">
                        <button class="btn btn-primary btn-launch" onclick="launchGame()">启动游戏</button>
                        <button class="btn btn-secondary" onclick="openSettings()">设置</button>
                    </div>
                </div>
                
                <div class="game-log-section">
                    <div class="log-header">
                        <h3>📄 游戏日志</h3>
                    </div>
                    <div class="game-log-container">
                        <pre class="game-output" id="game-output"></pre>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="main-footer">
            <span>HCL 启动器 v1.0.0</span>
        </footer>
    </div>

    <!-- 脚本文件 -->
    <script src="js/launch.js"></script>
    <script>
        // 打开设置页面
        window.openSettings = function () {
            if (window.electronAPI) {
                window.electronAPI.openSettings();
            }
        };

        // 用户菜单占位实现
        window.showUserMenu = function () {
            if (window.electronAPI && window.electronAPI.openSettings) {
                window.electronAPI.openSettings();
            }
        };

        // 添加账户
        window.addAccount = async function () {
            const username = window.prompt('请输入离线账户名称:');
            if (!username) {
                return;
            }
            try {
                await window.electronAPI.invoke('add-account', { username, type: 'offline' });
                window.location.reload();
            } catch (error) {
                window.alert('添加账户失败: ' + error.message);
            }
        };

        // 刷新版本列表
        window.refreshVersions = async function () {
            await renderVersions('all');
        };

        // 过滤版本
        window.filterVersions = function (type, event) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            renderVersions(type);
        };

        // 渲染版本列表
        window.renderVersions = async function (type = 'all') {
            const container = document.getElementById('version-list');
            if (!container) {
                return;
            }

            container.innerHTML = '<div class="version-empty">正在加载版本列表...</div>';

            try {
                const manifest = await window.electronAPI.invoke('get-version-list');
                let versions = (manifest && manifest.versions) || [];

                if (type === 'release') {
                    versions = versions.filter(v => v.type === 'release');
                } else if (type === 'snapshot') {
                    versions = versions.filter(v => v.type === 'snapshot');
                }

                if (versions.length === 0) {
                    container.innerHTML = '<div class="version-empty">没有可显示的版本</div>';
                    return;
                }

                container.innerHTML = versions.slice(0, 50).map(v => `
                    <div class="version-list-item" data-id="${v.id}">
                        <div class="version-name">${v.id}</div>
                        <div class="version-type">${v.type}</div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<div class="version-empty">版本列表加载失败: ${error.message}</div>`;
            }
        };

        // 启动游戏
        window.launchGame = async function () {
            if (!window.electronAPI) {
                return;
            }

            try {
                const config = await window.electronAPI.invoke('get-config');
                const accounts = await window.electronAPI.invoke('get-all-accounts');
                const account = accounts[0] || { username: 'Player', type: 'offline' };

                const result = await window.electronAPI.invoke('launch-game', {
                    account,
                    version: { id: config.lastVersion || '1.20.1', assets: '1.20' },
                    javaPath: config.javaPath || 'java',
                    memory: config.memory || 2048
                });

                if (!result || !result.success) {
                    window.alert('启动失败: ' + ((result && result.error) || '未知错误'));
                }
            } catch (error) {
                window.alert('启动失败: ' + error.message);
            }
        };

        // 页面加载完成后初始化启动器
        document.addEventListener('DOMContentLoaded', () => {
            window.gameLauncher = new HCLGameLauncher();

            // 监听游戏输出
            if (window.electronAPI) {
                window.electronAPI.on('game-output', (output) => {
                    const log = document.getElementById('game-output');
                    if (log) {
                        log.textContent += output.data || '';
                    }
                });
            }
        });
    </script>
</body>
</html>
